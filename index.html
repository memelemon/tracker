<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d19"><meta name="description" content="Рабочий дневник meme_lemon.">
<title>Дневник работы — meme_lemon</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#101a2b;--muted:#8190a8;--text:#edf3ff;--line:#25334a;--green:#b7f36b;--blue:#537bdc}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:760px;margin:auto;padding:18px 15px 60px}.top{margin-bottom:18px}.main-site{color:var(--green);text-decoration:none;font-size:13px;font-weight:700}
h1{font-size:25px;letter-spacing:-.04em;margin:0 0 20px}.section{margin-top:25px}.section-head{margin:0 0 11px}.section h2{font-size:12px;font-weight:700;letter-spacing:.08em;color:#aab9ce;margin:0}
.overview{display:flex;align-items:baseline;gap:10px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.score{font-size:42px;font-weight:750;letter-spacing:-.07em}.score-label{font:10px ui-monospace,monospace;color:var(--muted)}.month-label{margin-left:auto;font-size:11px;color:#b7c5d8}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday{text-align:center;font:9px ui-monospace,monospace;color:#66758f;padding:2px 0 5px}.day{aspect-ratio:1;border-radius:6px;background:#111a2a;border:1px solid rgba(132,153,187,.08);display:flex;align-items:center;justify-content:center;font-size:11px;color:#7f8da5;min-width:0}.day.empty{background:transparent;border-color:transparent}.day.report{color:#07121b;font-weight:800;border:1px solid rgba(255,255,255,.65)}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.cat{background:var(--panel);border:1px solid rgba(135,155,190,.12);border-radius:8px;padding:10px}.cat-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.cat-name{font-size:11px;color:#c6d1e2}.cat-val{font:11px ui-monospace,monospace;color:#dfe8f6}.cat-track{height:3px;background:#1b2940;border-radius:5px;margin-top:9px;overflow:hidden}.cat-track i{display:block;height:100%;border-radius:5px}
.archive-tools{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}.archive-tools input,.archive-tools select{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 10px;font:12px inherit}.archive-tools input{grid-column:1/-1}.archive-count{font-size:10px;color:var(--muted);margin:0 0 9px}.entry{background:var(--panel);border:1px solid rgba(135,155,190,.13);border-radius:9px;padding:13px;margin-bottom:8px}.entry-meta{font:10px ui-monospace,monospace;color:#9aabc5;margin-bottom:10px}.entry-text{font-size:13px;line-height:1.65;color:#e1e9f5;white-space:pre-wrap;overflow-wrap:anywhere}.empty-state{font-size:12px;color:var(--muted);padding:15px 0}
@media(min-width:600px){main{padding:30px 22px 70px}.calendar{gap:9px}.day{border-radius:10px;font-size:13px}.categories{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><main>
<div class="top"><a class="main-site" href="https://memelemon.github.io/" target="_blank" rel="noopener">← Основной сайт</a></div>
<h1>Дневник работы</h1>
<section class="overview"><div class="score" id="monthScore">—</div><div class="score-label">/ 100</div><div class="month-label" id="monthTitle"></div></section>
<section class="section"><div class="section-head"><h2>КАЛЕНДАРЬ</h2></div><div class="calendar" id="calendar"></div></section>
<section class="section"><div class="section-head"><h2>КАТЕГОРИИ</h2></div><div class="categories" id="categories"></div></section>
<section class="section" id="archive"><div class="section-head"><h2>АРХИВ ЗАПИСЕЙ</h2></div>
<div class="archive-tools"><input id="search" type="search" placeholder="Поиск по записям"><select id="year"><option value="">Все годы</option></select><select id="month"><option value="">Все месяцы</option></select></div>
<div class="archive-count" id="archiveCount"></div><div id="entries"></div></section>
</main>
<script>
fetch('./data.json').then(r=>r.json()).then(DATA=>{
const $=s=>document.querySelector(s);
const months=DATA.months.slice().sort((a,b)=>b.id.localeCompare(a.id));
const current=months.find(m=>m.id===DATA.currentMonth)||months[0];
const colorFor=n=>n>=90?'#8dff9b':n>=70?'#b7f36b':n>=45?'#f4d66d':n>=20?'#ff9a52':n>0?'#537bdc':'#18243a';
if(current){
 const avg=current.weeks.reduce((a,w)=>a+(w.score||0),0)/Math.max(1,current.weeks.length);
 $('#monthScore').textContent=Math.round(avg);$('#monthTitle').textContent=current.label||current.id;
 const first=new Date(current.id+'-01T12:00:00'),offset=(first.getDay()+6)%7,cal=$('#calendar');
 ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(d=>{const e=document.createElement('div');e.className='weekday';e.textContent=d;cal.append(e)});
 for(let i=0;i<offset;i++){const e=document.createElement('div');e.className='day empty';cal.append(e)}
 const reports=current.reports||[],reportDays=new Set(reports.map(r=>Number(r.date.slice(-2))));
 const coverEnd=Math.max(0,...reports.map(r=>Number((r.coverageEnd||r.date).slice(-2))));
 for(let d=1;d<=current.days;d++){const e=document.createElement('div');e.className='day';e.textContent=d;
 if(d<=coverEnd){e.classList.add('covered');const t=d/coverEnd;e.style.background='rgb('+Math.round(17+124*t)+','+Math.round(27+228*t)+','+Math.round(49+106*t)+')';e.style.color=t>.55?'#07121b':'#a9b8ce'}
 if(reportDays.has(d)){e.classList.add('report');e.style.background='#b7f36b'}cal.append(e)}
}
(DATA.categories||[]).forEach(c=>{const e=document.createElement('div');e.className='cat';const top=document.createElement('div');top.className='cat-top';const name=document.createElement('span');name.className='cat-name';name.textContent=c.name;const val=document.createElement('span');val.className='cat-val';val.textContent=c.score===null?'—':c.score+'%';top.append(name,val);const track=document.createElement('div');track.className='cat-track';const fill=document.createElement('i');fill.style.width=(c.score||0)+'%';fill.style.background=colorFor(c.score||0);track.append(fill);e.append(top,track);$('#categories').append(e)});
const records=months.flatMap(m=>(m.reports||[]).map(r=>({...r,monthId:m.id}))).sort((a,b)=>b.date.localeCompare(a.date));
const years=[...new Set(records.map(r=>r.date.slice(0,4)))].sort().reverse();
years.forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=y;$('#year').append(o)});
const monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
monthNames.forEach((n,i)=>{const o=document.createElement('option');o.value=String(i+1).padStart(2,'0');o.textContent=n;$('#month').append(o)});
function renderArchive(){
 const q=$('#search').value.trim().toLocaleLowerCase(),year=$('#year').value,month=$('#month').value;
 const found=records.filter(r=>(!year||r.date.startsWith(year))&&(!month||r.date.slice(5,7)===month)&&(!q||(r.rawText||'').toLocaleLowerCase().includes(q)));
 $('#archiveCount').textContent=found.length+' записей';
 const root=$('#entries');root.replaceChildren();
 if(!found.length){const empty=document.createElement('div');empty.className='empty-state';empty.textContent='Записей не найдено';root.append(empty);return}
 found.forEach(r=>{const card=document.createElement('article');card.className='entry';const meta=document.createElement('div');meta.className='entry-meta';meta.textContent=r.date;const raw=document.createElement('div');raw.className='entry-text';raw.textContent=r.rawText??'';card.append(meta,raw);root.append(card)});
}
['search','year','month'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',renderArchive));
renderArchive();
}).catch(()=>{document.querySelector('main').textContent='Не удалось загрузить данные.'});
</script></body></html>
