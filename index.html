<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>Дневник работы — meme_lemon</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:Inter,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:18px 14px 50px}
a{color:#b7f36b}
h1{font-size:25px;font-weight:600;margin:14px 0 8px}
h2{font-size:17px;font-weight:600;margin:0 0 12px}
p{line-height:1.5}
.top{margin-bottom:20px}
.note{font-size:13px;color:#bbb;margin:0 0 24px}
section{margin-top:25px}
#monthSummary,.day-panel,#calendar-wrap{background:#1b1b1b;border:1px solid #444;padding:12px}
#monthSummary{font-size:14px;line-height:1.55}
#calendar-wrap{padding:10px}
#calendar{font-size:13px}
.fc{--fc-border-color:#555;--fc-page-bg-color:#1b1b1b;--fc-neutral-bg-color:#252525;--fc-list-event-hover-bg-color:#333;--fc-today-bg-color:rgba(183,243,107,.13);--fc-button-bg-color:#333;--fc-button-border-color:#555;--fc-button-hover-bg-color:#4a4a4a;--fc-button-hover-border-color:#777;--fc-button-active-bg-color:#b7f36b;--fc-button-active-border-color:#b7f36b;--fc-button-text-color:#eee}
.fc .fc-toolbar-title{font-size:18px;font-weight:500}
.fc .fc-button{font-size:12px;text-transform:none;padding:5px 8px;box-shadow:none}
.fc .fc-daygrid-day-number{color:#ddd;text-decoration:none;padding:6px}
.fc .fc-col-header-cell-cushion{color:#aaa;text-decoration:none;font-weight:400;padding:7px 2px}
.fc .fc-daygrid-day-frame{min-height:48px}
.fc .fc-daygrid-day.report-day{background:#b7f36b;color:#111}
.fc .fc-daygrid-day.report-day .fc-daygrid-day-number{color:#111;font-weight:700}
.fc .fc-daygrid-day.covered-day{background:#344331}
.fc .fc-daygrid-day.selected-day{outline:2px solid #eee;outline-offset:-2px}
.day-panel{margin-top:10px;min-height:105px}
.day-date{font-size:13px;color:#b7f36b;margin-bottom:9px}
.day-content{font-size:14px;line-height:1.6;white-space:pre-wrap}
.search{width:100%;padding:10px;background:#1b1b1b;border:1px solid #555;color:#eee;font:14px Arial,sans-serif;margin-bottom:10px}
.archive-count{font-size:12px;color:#aaa;margin:0 0 8px}
.post{padding:13px 2px;border-bottom:1px solid #444}
.post-date{font-size:12px;color:#b7f36b;margin-bottom:7px}
.post-text{font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{font-size:13px;color:#aaa;padding:12px 0}
@media(max-width:520px){
 main{padding:14px 10px 40px}
 .fc .fc-toolbar{display:flex;flex-wrap:wrap;gap:8px}
 .fc .fc-toolbar-title{font-size:16px}
 .fc .fc-button{padding:5px 6px;font-size:11px}
 .fc .fc-daygrid-day-frame{min-height:40px}
}
</style>
</head>
<body>
<main>
<div class="top"><a href="https://memelemon.space/">← memelemon.space</a></div>
<h1>Дневник работы</h1>
<p class="note">Личный дневник проектов и сделанных вещей.</p>

<section>
<h2>Месяц</h2>
<div id="monthSummary">Загрузка...</div>
</section>

<section>
<h2>Календарь</h2>
<div id="calendar-wrap"><div id="calendar"></div></div>
<div class="day-panel">
<div class="day-date" id="dayDate"></div>
<div class="day-content" id="dayContent"></div>
</div>
</section>

<section>
<h2>Все записи</h2>
<input class="search" id="search" type="search" placeholder="Поиск по записям...">
<div class="archive-count" id="archiveCount"></div>
<div id="posts"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script>
fetch('./data.json?v=20261125-1',{cache:'no-store'})
.then(response=>response.json())
.then(DATA=>{
const months=DATA.months||[];
const reports=months.flatMap(month=>month.reports||[]);
const reportDates=new Set(reports.map(report=>report.date));
const selectedDate={value:new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0')+'-'+String(new Date().getDate()).padStart(2,'0')};

function dateToISO(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');}
function findMonth(date){
return months.find(month=>month.id===date.slice(0,7));
}
function showDay(date){
selectedDate.value=date;
const report=reports.find(item=>item.date===date);
document.getElementById('dayDate').textContent=new Date(date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
document.getElementById('dayContent').textContent=report?report.rawText:'На эту дату записей пока нет.';
document.querySelectorAll('.fc-daygrid-day').forEach(cell=>{
cell.classList.toggle('selected-day',cell.dataset.date===date);
});
}
function showMonth(date){
const month=findMonth(date);
document.getElementById('monthSummary').textContent=month?(month.summary||'Для этого месяца пока нет сводки.'):'Записей за этот месяц пока нет.';
}

const calendarEl=document.getElementById('calendar');
const calendar=new FullCalendar.Calendar(calendarEl,{
initialView:'dayGridMonth',
initialDate:DATA.currentMonth+'-01',
firstDay:1,
height:'auto',
fixedWeekCount:false,
headerToolbar:{left:'prev,next today',center:'title',right:''},
buttonText:{today:'Сегодня'},
dateClick:info=>showDay(info.dateStr),
datesSet:info=>{
const date=dateToISO(info.view.currentStart);
showMonth(date);
},
dayCellDidMount:info=>{
const date=dateToISO(info.date);
if(reportDates.has(date)) info.el.classList.add('report-day');
else{
const month=findMonth(date);
if(month){
const inCoverage=(month.reports||[]).some(report=>report.coverageStart&&report.coverageEnd&&date>=report.coverageStart&&date<=report.coverageEnd);
if(inCoverage) info.el.classList.add('covered-day');
}
}
}
});
calendar.render();
showDay(selectedDate.value);

const records=reports.slice().sort((a,b)=>b.date.localeCompare(a.date));
function renderPosts(){
const query=document.getElementById('search').value.trim().toLocaleLowerCase();
const found=records.filter(item=>(item.rawText||'').toLocaleLowerCase().includes(query));
document.getElementById('archiveCount').textContent=found.length+' записей';
const root=document.getElementById('posts');
root.replaceChildren();
if(!found.length){
const empty=document.createElement('div');empty.className='empty';empty.textContent='Ничего не найдено';root.append(empty);return;
}
found.forEach(item=>{
const article=document.createElement('article');article.className='post';
const date=document.createElement('div');date.className='post-date';date.textContent=item.date;
const content=document.createElement('div');content.className='post-text';content.textContent=item.rawText||'';
article.append(date,content);root.append(article);
});
}
document.getElementById('search').addEventListener('input',renderPosts);
renderPosts();
})
.catch(error=>{
document.getElementById('monthSummary').textContent='Не удалось загрузить данные.';
console.error(error);
});
</script>
</body>
</html>
